    <meta name="description" content="像素小镇是网页像素画板：逐格上色、像素喷漆、像素重力，还能进小镇串门、组队作画、挂作品到灯板。">
    <meta name="keywords" content="像素画,像素画板,像素小镇,像素游戏,像素重力,像素喷漆,ESP32灯板">
    <meta property="og:type" content="website">

    <meta property="og:description" content="逐格上色、喷漆、像素重力，和镇民一起画像素画。">

    <meta property="og:image" content="https://light-field.pages.dev/icons/icon-512.png">
    <meta name="twitter:card" content="summary">
    <script>
      /* 前端版本号。设置页的「检查更新」靠它和服务器上 index.html 里的值对比，
         判断当前这个页面是不是旧版；每次发版记得同时改这里和更新日志。 */
      window.__LW_VER = '1.4.10'
    </script>
    <script>
      /* 设置页的「刷新到最新版」会带一个一次性参数（_u）跳过来 —— 那是用来
         绕开浏览器和 PWA 容器缓存的。它只在那一次跳转里有意义，落地就抹掉，
         免得地址栏一直挂着；replaceState 不会多留一条历史记录。 */
      ;(function () {
        try {
          var u = new URL(location.href)
          if (!u.searchParams.has('_u')) return
          u.searchParams.delete('_u')
          var q = u.searchParams.toString()
          history.replaceState(null, '', u.pathname + (q ? '?' + q : '') + u.hash)
        } catch (e) {}
      })()
    </script>
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('lw-theme')
          if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', t)
          /* data-mood 只分「明 / 暗」两类。视图里凡是「暗色下要换个背景」的地方
             一律用 [data-mood="dark"]，别用 [data-mood="dark"] ——
             暗色主题有 8 个，只有 id 叫 dark 的那个会被前者命中，
             其余 7 个（夜阑/深海/墨林/玫瑰夜/森语/夜航/炭）会保持浅色背景
             配浅色文字，基本看不清。 */
          document.documentElement.setAttribute('data-mood', /night|midnight|ink|charcoal|rose|forest|dark/.test(t) ? 'dark' : 'light')
          if (localStorage.getItem('lw-glass') === '0') document.documentElement.classList.add('glass-off')
        } catch (e) {}
      })()
    </script>
    <!-- 首屏底色。
         site.css 是外链，在它到位之前页面是**纯白**的 —— 手机上一次要白一秒多，
         看着就像「卡住了」。原来样式内联在 HTML 里没这个问题，是拆出去的副作用。
         这里只内联「底色」这一件事：取 site.css 里 :root / [data-mood="dark"]
         的 --bg 渐变起始色，所以真正到位时只是渐变淡入，看不出跳变。
         ⚠️ 改 site.css 里 --bg 的配色时，这两行也要跟着改。 -->
    <style>
      html { background: #fdf8f2; }
      [data-mood="dark"] { background: #211c17; }
    </style>
    <script>
      /* ---------- 首屏预载：把「这一页要用的模块图」提前 ----------
         SPA 的第一帧要等 app.js 跑完才 import 视图（./views/xxx.js），
         视图自己还要 import 它的 styles/template/constants —— 这是两层串行的 RTT，
         手机上一次就是几百毫秒（实测线上 /paint 因此多花约 0.8～0.9 秒）。

         <link rel="modulepreload"> 会把模块**连同它的依赖**一起预取，
         所以这里只需要按当前路径推一个视图名，不用维护子模块清单。
         推不出来（路径不认识）就什么都不做：少一次优化而已，不会出错。 */
      ;(function () {
        try {
          var p = location.pathname
          if (p === '/' || p === '') {
            /* 首页入口由设置决定：有没画完的草稿就直接回画板，否则看 lw-entrance。 */
            var raw = localStorage.getItem('paintDraft')
            var hasDraft = false
            try { hasDraft = !!(raw && JSON.parse(raw).pixels.length) } catch (e) {}
            p = hasDraft ? '/paint' : (localStorage.getItem('lw-entrance') || '/paint')
          }
          var parts = p.split('/').filter(Boolean)
          var seg = parts[0] || 'paint'
          if (seg === 'u') seg = 'user'
          /* /town/home 归小镇页；/town/bag、/town/card、/town/hotpot 是各自独立的二级页 */
          if (seg === 'town' && parts[1] && parts[1] !== 'home') seg = parts[1]
          if (!/^[a-z][a-z0-9-]*$/.test(seg)) return
          var l = document.createElement('link')
          l.rel = 'modulepreload'
          l.href = '/views/' + seg + '.js'
          document.head.appendChild(l)
        } catch (e) {}
      })()
    </script>
    <!-- 主站样式（原 index.html 的内联 <style>，已拆到 styles/site.css）。
         保持内联会带来首屏少一次请求，但 600 行塞在 HTML 里没人愿意读；
         这层不是「关键首屏样式」，拆出去不影响可读性与正确性。 -->
    <link rel="stylesheet" href="/styles/site.css">
    <style id="global-motion">
      /* ---------- 全局「减弱动态效果」兜底 ----------
         上面那几层（anim / polish / fx / deco）各自都写了保护块，
         但都是**列类名**的写法 —— 每加一个新动画就得回来补一条，
         加漏一个，开了减弱动效的用户就还会看到那一个在动。

         这里用通配再兜一层：把动画时长压到近乎 0、只播一次，
         过渡也压到 0。不管以后谁加了什么动画，都自动被覆盖。
         这是各家设计系统通用的做法，比逐条枚举可靠得多。 */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: .01ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .01ms !important;
          transition-delay: 0ms !important;
          scroll-behavior: auto !important;
        }
        /* 无限循环的那些直接停掉，不然会「闪一下」 */
        [class*='lwa-'][class*='pulse'],
        [class*='lwa-'][class*='beat'],
        [class*='lwa-'][class*='float'],
        [class*='lwa-'][class*='glow'],
        [class*='lwa-'][class*='breathe'],
        [class*='lwa-'][class*='shine'],
        [class*='lwa-'][class*='ring'],
        [class*='lwdeco-wave'] i,
        [class*='lwfx-unread']::after {
          animation: none !important;
        }
      }
    </style>
    <style id="lw-anim-level">
      /* ---------- 动画档位 ----------
         动效越多越费电、越容易在低端机上掉帧，所以给个用户可控的开关。
         档位写在 <html data-anim-level="..."> 上（由 lw-pxicon.js 维护），
         这里用 CSS 统一开关，几层动画不用各写一遍判断。 */

      /* 关闭：动画和过渡全停 */
      html[data-anim-level='off'] *,
      html[data-anim-level='off'] *::before,
      html[data-anim-level='off'] *::after {
        animation: none !important;
        transition: none !important;
      }

      /* 省电：只停「无限循环」和「一直闪」的装饰动画。
         入场动画保留 —— 那是一次性的，不影响性能和电量。 */
      html[data-anim-level='low'] [class*='lwa-pulse'],
      html[data-anim-level='low'] [class*='lwa-beat'],
      html[data-anim-level='low'] [class*='lwa-float'],
      html[data-anim-level='low'] [class*='lwa-glow'],
      html[data-anim-level='low'] [class*='lwa-breathe'],
      html[data-anim-level='low'] [class*='lwa-shine'],
      html[data-anim-level='low'] [class*='lwa-ring'],
      html[data-anim-level='low'] [class*='lwa-heartbeat'],
      html[data-anim-level='low'] .anim-badge,
      html[data-anim-level='low'] .room-badge,
      html[data-anim-level='low'] .img-badge,
      html[data-anim-level='low'] .card-tag,
      html[data-anim-level='low'] [class*='lwdeco-wave'] i,
      html[data-anim-level='low'] [class*='lwfx-unread']::after,
      html[data-anim-level='low'] [class*='lwdeco-lv-bar'] i::after {
        animation: none !important;
      }

      /* 丰富：循环动画快一点，入场稍长（更有存在感） */
      html[data-anim-level='rich'] [class*='lwa-pulse'],
      html[data-anim-level='rich'] [class*='lwa-beat'],
      html[data-anim-level='rich'] [class*='lwa-float'],
      html[data-anim-level='rich'] [class*='lwa-breathe'] {
        animation-duration: .7s !important;
      }
    </style>
    <style id="lw-pxicon-style">
      /* 自绘像素图标的宿主。用 <i data-px="名字"> 会被 LWIcon 换成 canvas。 */
      .px-ico-host {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: -0.15em;
        line-height: 1;
        flex: none;
      }
      /* 混在文字里的图标：稍微下沉一点，跟中文字的基线对齐 */
      .px-ico-inline {
        vertical-align: -0.15em;
        margin: 0 1px;
      }
      .px-ico-host canvas.lwicon {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* 作为单独一行的大图标时给点入场 */
      .px-ico-hero .px-ico-host { animation: lwa-pop .4s cubic-bezier(.2,1.3,.4,1) both }
      @media (prefers-reduced-motion: reduce) {
        .px-ico-hero .px-ico-host { animation: none }
      }
    </style>
    <style id="boot-fail-style">
      #bootFail {
        position: fixed; inset: 0; z-index: 999999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 10px; padding: 28px; text-align: center;
        background: var(--surface, #fff); color: var(--text, #3b342c);
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #bootFail[hidden] { display: none }
      #bootFail b { font-size: 17px }
      #bootFail p { margin: 0; font-size: 13px; color: var(--text-muted, #6b5f50); line-height: 1.7; max-width: 300px }
      #bootFail button {
        margin-top: 6px; padding: 11px 26px;
        border: 0; border-radius: 999px;
        background: var(--accent, #5b8def); color: #fff;
        font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      }
    </style>
    <style id="global-noselect">
      /* ---------- 全站禁止选中文字 ----------
         起因：按钮、卡片这些交互元素上，手指按下去稍微一划就选中了一片文字，
         手机上还会弹出「拷贝 / 查询 / 翻译」那个系统菜单，非常干扰。

         ★ 输入框必须保留选中能力 —— 不然改错字、选中重输都做不到。
         ★ 法律页面（用户协议、版权声明）也保留 —— 那两页的内容
           用户有理由复制留存，禁掉不合理。 */
      html, body, #app {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        /* iOS 长按元素时弹出的系统菜单（拷贝/共享/查询） */
        -webkit-touch-callout: none;
      }
      /* 点击时那层灰色高亮，手机上一闪一闪的很难看 */
      * { -webkit-tap-highlight-color: transparent; }

      /* 以下这些地方恢复可以选中 */
      input,
      textarea,
      select,
      [contenteditable="true"],
      .selectable,
      /* 法律文本：用户有理由复制留存 */
      .page.legal,
      .page.legal * {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
      /* 输入框里当然也要能选 */
      input, textarea, select, [contenteditable="true"] {
        -webkit-touch-callout: default;
      }
    </style>
    <style id="view-style"></style>
    <!-- 细节收敛层。
         ★ 必须放在 #view-style **之后** —— 视图 CSS 是运行时注入到
           #view-style 里的，同优先级下后出现的赢。放前面就白写了。 -->
    <link rel="stylesheet" href="/styles/detail.css">

    <script src="/lw-sfx.js"></script>

    <!-- 这两个模块图每个页面都要用，但浏览器要等父模块下完才知道它们存在，
         于是白等一轮 RTT（实测 DCL 因此晚了约 400ms）。显式提前拉。 -->
    <link rel="modulepreload" href="/lw-polish/polish-styles.js">
    <link rel="modulepreload" href="/lw-polish/polish-icons.js">
    <link rel="modulepreload" href="/lw-pxicon/icons.js">
    <link rel="modulepreload" href="/lw-pxicon/emoji.js">

    <script src="/vue.global.prod.js"></script>
    <script src="/vue-router.global.prod.js"></script>
    <script src="/omggif.js"></script>
    <script src="/qrcode.js"></script>
    <script src="/themes.js"></script>
    <script src="/lw-avatar.js"></script>
    <script src="/lw-spray.js"></script>
    <script src="/lw-gravity.js"></script>
    <script src="/lw-thumb.js"></script>
    <script src="/lw-cache.js"></script>
    <script src="/lw-anim.js"></script>
    <script type="module" src="/lw-polish.js"></script>
    <script src="/lw-fx.js"></script>
    <script type="module" src="/lw-pxicon.js"></script>
    <script src="/lw-deco.js"></script>
    <script src="/lw-dialog.js"></script>
    <script src="/lw-workmenu.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast"></div>
    <!-- 启动失败兜底。
         app.js 用的是**静态 import**，所以任何一个视图文件有语法错误，
         整个模块图就加载不了，Vue 挂不上，页面会是一片空白 ——
         用户只看到白屏，完全不知道出了什么事。
         这里放一个探针：几秒后如果 #app 还是空的，就说明没挂上，
         把真实错误显示出来，并给一个刷新按钮。 -->
    <div id="bootFail" hidden>
      <b>页面没能启动</b>
      <p id="bootFailMsg">可能是网络不稳，或者刚才更新了一半。</p>
      <button id="bootFailBtn" type="button">重新加载</button>
    </div>
    <script>
      ;(function () {
        var errs = []
        window.addEventListener('error', function (e) {
          if (e && e.message) errs.push(e.message + (e.lineno ? ' （第 ' + e.lineno + ' 行）' : ''))
        })
        window.addEventListener('unhandledrejection', function (e) {
          errs.push('Promise: ' + String(e.reason).slice(0, 120))
        })
        function show() {
          var app = document.getElementById('app')
          if (app && app.children.length) return // 挂上了，什么都不做
          var box = document.getElementById('bootFail')
          if (!box) return
          var msg = document.getElementById('bootFailMsg')
          if (msg && errs.length) msg.textContent = errs[0]
          box.hidden = false
        }
        // 第一次检查给足时间（慢网 + 冷启动）
        setTimeout(show, 4000)
        var btn = document.getElementById('bootFailBtn')
        if (btn) btn.addEventListener('click', function () { location.reload() })
      })()
    </script>
    <script type="module" src="/app.js"></script>
    <script src="/lw-dust.js"></script>
  </body>
</html>
